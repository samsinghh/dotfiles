name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck zsh

      - name: Check shell syntax
        run: |
          bash -n install.sh
          zsh -n zsh/.zshrc

      - name: Run ShellCheck
        run: shellcheck install.sh

      - name: Check whitespace
        run: git diff --check

  neovim:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Neovim
        run: brew install neovim

      - name: Test clean Neovim startup
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/data
          XDG_STATE_HOME: ${{ runner.temp }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          cp -R "$GITHUB_WORKSPACE/nvim" "$XDG_CONFIG_HOME/nvim"
          nvim --headless "+Lazy! restore" +qa
          nvim --headless +qa
